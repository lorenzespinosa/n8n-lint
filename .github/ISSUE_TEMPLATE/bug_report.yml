name: Bug Report
description: Report a bug in n8n-lint
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the details below.

  - type: input
    id: version
    attributes:
      label: n8n-lint version
      description: Run `n8n-lint --version` to find this.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version` to find this.
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: input
    id: n8n-version
    attributes:
      label: n8n version (if relevant)
      description: Which version of n8n exported the workflow?
      placeholder: "1.30.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `n8n-lint workflow.json`
        2. See incorrect output...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include terminal output if possible.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow JSON (if applicable)
      description: Paste the workflow JSON that triggers the bug. Remove any real credentials first.
      render: json
    validations:
      required: false
