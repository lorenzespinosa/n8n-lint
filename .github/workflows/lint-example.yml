name: Lint examples

on:
  push:
    paths:
      - 'examples/**'
      - 'src/**'
      - 'action.yml'
      - '.github/workflows/lint-example.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the clean example workflow
        uses: ./
        with:
          workflows: 'examples/clean-intake-workflow.json'
